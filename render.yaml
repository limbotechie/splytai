services:
  - type: web
    name: splyt-testnet-relay
    runtime: node
    rootDir: apps/backend
    buildCommand: "npm install --no-audit --no-fund && npm run build"
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3001
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
